name: Publish v0.5.6.dev58 abort+fs+ipc+deadprod+hmarecv ROCm (nightly overlay)

on:
  push:
    branches:
      - v0.5.6.dev58-abort-fs-ipc-deadprod-hmarecv
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  RELEASE_TAG: v0.5.6.dev58-abort-fs-ipc-deadprod-hmarecv-overlay-rocm
  IMAGE: ghcr.io/smurthy024/lmcache-server
  IMAGE_TAG: v0.5.6.dev58-abort-fs-ipc-deadprod-hmarecv-overlay-rocm
  WHEEL_VERSION: 0.5.6.dev58+abort4136.fs4752.ipc4261.deadprod.hmarecv.overlay.rocm7.2
  # Base on our own published dev58 overlay wheel, NOT upstream's nightly-rocm
  # tag. That tag is a rolling pointer: it moved dev58 -> dev75 on 2026-09-23,
  # so the old pinned URL now 404s and the build dies in curl -fsSL. Our
  # release is immutable and still carries the dev58 hipified cuda_ops, which
  # also keeps this image a clean A/B against what production runs today --
  # only the failed_recving change differs.
  NIGHTLY_WHL_URL: https://github.com/smurthy024/LMCache/releases/download/v0.5.6.dev58-abort-fs-ipc-deadprod-overlay-rocm/lmcache-0.5.6.dev58%2Babort4136.fs4752.ipc4261.deadprod.overlay.rocm7.2-cp312-cp312-manylinux_2_35_x86_64.whl

defaults:
  run:
    shell: bash

jobs:
  build-and-publish:
    name: Overlay nightly-rocm + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/share/swift \
            /usr/local/.ghcup
          docker image prune -af
          df -h /

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps (torch for CppExtension only; no HIP cuda_ops rebuild)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install wheel setuptools setuptools-scm numpy pybind11

      - name: Build overlay wheel
        env:
          NIGHTLY_WHL_URL: ${{ env.NIGHTLY_WHL_URL }}
          WHEEL_VERSION: ${{ env.WHEEL_VERSION }}
          OUT_DIR: dist
        run: |
          chmod +x .github/scripts/build_nightly_overlay_rocm_wheel.sh
          .github/scripts/build_nightly_overlay_rocm_wheel.sh

      - name: Publish overlay wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${RELEASE_TAG}" --yes 2>/dev/null || true
          gh release create "${RELEASE_TAG}" \
            --title "LMCache v0.5.6.dev58 abort+fs+ipc+deadprod+hmarecv ROCm (nightly overlay)" \
            --notes "Adds request-level KV load-failure reporting (KVConnectorTransferResults.failed_recving) so hybrid/multi-group KV layouts recover via kv_load_failure_policy=recompute instead of raising in scheduler._handle_invalid_blocks. On top of: PR #4939 (abort; #4136 rebase) + PR #4752 (fs_native/salt) + PR #4261 (IPC teardown) + deadprod producer-wait/drain-close." \
            --prerelease \
            dist/*.whl

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ROCm image
        run: |
          docker build \
            -f docker/Dockerfile.server-rocm \
            --build-arg BASE_IMAGE=vllm/vllm-openai-rocm:v0.27.1 \
            -t "${IMAGE}:${IMAGE_TAG}" \
            -t "${IMAGE}:${RELEASE_TAG}" \
            .
          docker push "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:${RELEASE_TAG}"

      - name: Summary
        run: |
          echo "## ROCm overlay published" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Release: https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Image: ${IMAGE}:${IMAGE_TAG}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Wheel version: ${WHEEL_VERSION}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Base: official nightly-rocm 0.5.6.dev58 cuda_ops (HIP) preserved" >> "${GITHUB_STEP_SUMMARY}"
