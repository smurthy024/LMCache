name: Publish abort4136 ROCm

on:
  push:
    branches:
      - fix/abort-during-retrieve-4136
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  RELEASE_TAG: v0.5.3-abort4136-4396-rocm
  IMAGE: ghcr.io/smurthy024/lmcache-server
  IMAGE_TAG: abort4136-4396-rocm
  ROCM_IMAGE: rocm/dev-ubuntu-22.04:7.2.3-complete
  TORCH_ROCM_SPEC: torch==2.11.0+rocm7.2
  TORCH_ROCM_INDEX: https://download.pytorch.org/whl/rocm7.2
  PYTORCH_ROCM_ARCH: gfx942;gfx950
  WHEEL_VERSION: 0.5.3+abort4136.4396.rocm7.2

defaults:
  run:
    shell: bash

jobs:
  build-and-publish:
    name: Build and publish ROCm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/share/swift \
            /usr/local/.ghcup
          docker image prune -af
          df -h /

      - name: Build ROCm cp312 wheel
        run: |
          docker run --rm \
            -e PYTORCH_ROCM_ARCH="${PYTORCH_ROCM_ARCH}" \
            -e SETUPTOOLS_SCM_PRETEND_VERSION="${WHEEL_VERSION}" \
            -e TORCH_ROCM_SPEC="${TORCH_ROCM_SPEC}" \
            -e TORCH_ROCM_INDEX="${TORCH_ROCM_INDEX}" \
            -v "${PWD}:/work/LMCache" \
            --entrypoint bash "${ROCM_IMAGE}" \
            /work/LMCache/.github/scripts/build_rocm_wheel.sh
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1

      - name: Publish ROCm wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${RELEASE_TAG}" --yes 2>/dev/null || true
          gh release create "${RELEASE_TAG}" \
            --title "LMCache abort4136 ROCm" \
            --notes "ROCm 7.2 / cp312 build containing LMCache PR #4136 (abort during retrieve) and PR #4396 (fs_native cache_salt + object_group_id)." \
            --prerelease \
            dist/*.whl

      - name: Reclaim builder space
        run: |
          docker image rm "${ROCM_IMAGE}" 2>/dev/null || true
          docker image prune -af
          df -h /

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ROCm image
        run: |
          docker build \
            -f docker/Dockerfile.server-rocm \
            --build-arg BASE_IMAGE=vllm/vllm-openai-rocm:v0.27.1 \
            -t "${IMAGE}:${IMAGE_TAG}" \
            -t "${IMAGE}:${RELEASE_TAG}" \
            .
          docker push "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:${RELEASE_TAG}"

      - name: Summary
        run: |
          echo "## ROCm published" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Release: https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Image: ${IMAGE}:${IMAGE_TAG}" >> "${GITHUB_STEP_SUMMARY}"
